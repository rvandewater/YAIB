[build-system]
requires = ["uv_build>=0.7 ,<0.12"]
build-backend = "uv_build"

[project]
name = "yaib"
version = "1.0.3"

description = "🧪Yet Another ICU Benchmark: a holistic framework for the standardization of clinical prediction model experiments. Provide custom datasets, cohorts, prediction tasks, endpoints, preprocessing, and models. Paper: https://arxiv.org/abs/2306.05109"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Robin van de Water", email = "robin.vandewater@hpi.de" },
    { name = "Hendrik Schmidt"},
    { name = "Patrick Rockenschaub"}
]
keywords = [
  "benchmark", "mimic-iii", "eicu", "hirid", "clinical-ml",
  "machine-learning", "time-series", "mimic-iv", "icu", "ehr"
]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.10",
]
requires-python = ">=3.10"

dependencies = [
  "matplotlib",
  "gin-config==0.5.0",
  "pytorch-ignite==0.5.0.post2",
  "torch==2.6.0",
  "lightning==2.4.0",
  "torchmetrics==1.0.3",
  "lightgbm==4.6.0",
  "xgboost==2.1.0",
  "imbalanced-learn==0.12.3",
  "catboost==1.2.5",
  "numpy==1.26.0",
  "pandas>=2.2.2",
  "polars>=1.9.0",
  "pyarrow==14.0.1",
  "scikit-learn==1.5.0",
  "tensorboard>=2.12.2",
  "tqdm==4.66.3",
  "einops==0.6.1",
  "hydra-core==1.3",
  "optuna==4.0.0",
  "optuna-integration==4.0.0",
  "wandb>=0.17.3",
  "recipies>=1.0",
  "scikit-optimize-fix==0.9.1",
  "hydra-submitit-launcher==1.2.0",
  "shap==0.49.1",
  "numba==0.60.0",
]

[project.scripts]
icu-benchmarks = "icu_benchmarks.run:main"

[project.urls]
Homepage = "https://github.com/rvandewater/YAIB"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-root = ""
module-name = "icu_benchmarks"

[dependency-groups]
dev = [
  "coverage>=7.14",
  "flake8>=7.0.0",
  "pre-commit>=4.6.0",
  "pytest==7.3.1",
  "pytest-runner==6.0.1",
  "ruff",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu118", marker = "sys_platform != 'darwin'" }
]


[tool.ruff]
line-length = 127
include = ["*.py"]
