name: E2E Integration Test

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  e2e-integration-test:
    name: Run YAIB E2E Integration Test (XGBClassifier / Mortality24)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install YAIB and dependencies
        run: uv sync

      - name: Verify icu-benchmarks CLI is available
        run: uv run icu-benchmarks --help

      - name: Run E2E integration test
        run: |
          uv run icu-benchmarks train \
            -d demo_data/mortality24/mimic_demo \
            -n mimic_demo \
            -t BinaryClassification \
            -tn Mortality24 \
            -m XGBClassifier \
            --seed 2222 \
            -l yaib_logs/ \

      - name: Verify log output was created
        run: |
          if [ ! -d "yaib_logs/mimic_demo" ]; then
            echo "ERROR: Expected log directory ../yaib_logs/mimic_demo was not created."
            exit 1
          fi
          echo "Log directory found:"
          find yaib_logs/ -type f | head -50

      - name: Upload run logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yaib-e2e-logs
          path: yaib_logs/
          retention-days: 7
